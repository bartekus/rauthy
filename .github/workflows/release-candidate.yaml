# Builds, tests and reviews a downstream release candidate.
#
# This workflow never publishes anything and never needs a publication credential. It produces the
# exact binaries that release-publish.yaml later promotes, so the bytes that are tested here are
# the bytes that ship: nothing is rebuilt between the two.
#
# Least privilege: every job declares `contents: read` and nothing else, except the review job,
# which additionally needs to write a pull-request comment. No job references a registry token.
name: release candidate

# Only `push` to a release branch or a release line, and a manual dispatch. A `pull_request`
# trigger would run the whole matrix a second time on the same commit; a pull request onto a
# release line shows the checks from the push run, because GitHub attaches them to the commit.
#
# The release line is here because a merge produces a new commit. The publish workflow promotes
# only a run whose commit is the one it publishes, so the run that qualifies a release is the one
# on the merge commit, not the one on the branch that was merged.
on:
  push:
    branches:
      - 'release/**'
      - 'patched/**'
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The toolchain upstream's own builder image pins. Building inside a bookworm container puts a
  # glibc 2.36 floor under the artifact, which is what the distroless runtime and the consumer's
  # bookworm-slim runtime both provide. Building on the runner's own glibc would raise that floor
  # and the binary would not run where it has to.
  RUST_VERSION: '1.95.0'
  BUILD_IMAGE: 'rust:1.95.0-bookworm'
  UPSTREAM_BASE_IMAGE: 'ghcr.io/sebadob/rauthy:0.36.2'
  # The previous published patched release, pinned by index digest, for acceptance leg V.
  PREVIOUS_PATCHED_IMAGE: 'ghcr.io/bartekus/rauthy-patched:0.36.2-patched.2@sha256:ea114a8bb743d578dea6d7800916ee43550939c749a2cf586f9abdc0d0c52478'
  # The consumer whose own live suite runs against this candidate, at a pinned commit of its
  # public repository. Bumped deliberately, never followed.
  CONSUMER_REPO: 'statecrafting/rahi'
  CONSUMER_REF: 'b815b18ce53e366e3771799652ede8e58e69e801'

jobs:
  assets:
    name: frontend and wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,just

      - name: Build the wasm modules and the frontend
        run: |
          set -euxo pipefail
          npm --prefix frontend ci
          just build-wasm
          just build-ui

      # The frontend half of upstream's `just is-clean`. The rust half is the `checks` job.
      - name: Check the frontend
        run: npm --prefix frontend run check

      # The generated assets are what gets embedded into the binary, so they are built once and
      # handed to every build job. Rebuilding them per architecture would risk shipping two
      # different frontends under one version.
      - name: Package the generated assets
        run: tar -czf generated-assets.tar.gz templates/html static/v1 frontend/src/wasm

      - uses: actions/upload-artifact@v4
        with:
          name: generated-assets
          path: generated-assets.tar.gz
          retention-days: 30

  checks:
    name: style and unit checks
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: generated-assets
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: tar -xzf generated-assets.tar.gz
      - run: cargo fmt --all --check
      # The same gate upstream's `just is-clean` uses. `--all-targets` would additionally lint
      # upstream's own test code, which this release does not modify.
      - run: cargo clippy --workspace -- -D warnings

  # What the build actually resolves, recorded and checked before anything is built from it. The
  # shape is enforced here (one copy of each patched package, one openraft, no upstream package
  # beside them); whether every package comes from the registry is recorded rather than enforced,
  # so that a candidate against an unpublished dependency can still be exercised, and it is the
  # publish workflow that refuses such a candidate.
  graph:
    name: dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: The lock file is complete and the graph has the right shape
        run: |
          set -euo pipefail
          # `--locked` fails if resolving the manifests would change the lock file.
          cargo metadata --locked --format-version 1 > metadata.json
          python3 assets/release/check_graph.py --structure Cargo.lock
          echo "registry graph: $(python3 assets/release/check_graph.py --report Cargo.lock)"
          python3 assets/release/check_graph.py --table Cargo.lock | tee -a "$GITHUB_STEP_SUMMARY"
          cargo tree --locked -i hiqlite-patched -e normal,build --depth 1 | tee hiqlite-tree.txt
          cargo tree --locked --duplicates -e normal > duplicates.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            metadata.json
            hiqlite-tree.txt
            duplicates.txt
          retention-days: 30

  tests:
    name: integration suite (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: assets
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [hiqlite, postgres]
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: rauthy
          POSTGRES_PASSWORD: 123SuperSafe
          POSTGRES_DB: rauthy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rauthy" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/download-artifact@v4
        with:
          name: generated-assets
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: tar -xzf generated-assets.tar.gz

      # The recipes manage their own Postgres container, which the runner already provides here.
      - name: Run the suite
        run: |
          set -euxo pipefail
          cargo build
          if [ "${{ matrix.backend }}" = "postgres" ]; then
            export HIQLITE=false HQL_CACHE_STORAGE_DISK=false
          fi
          PUB_URL=localhost:8081 RP_ORIGIN=http://localhost:8081 \
            ./target/debug/rauthy serve -c config-test.toml --test &
          echo $! > .test_pid
          for _ in $(seq 1 90); do
            curl -sf localhost:8081/auth/v1/ping && break
            sleep 1
          done
          cargo test
          kill "$(cat .test_pid)"

  build:
    name: release binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: assets
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-assets
      - run: tar -xzf generated-assets.tar.gz

      # jemalloc built with a 64K page size works on 4K and 64K kernels alike; the reverse is not
      # true, so the aarch64 artifact is built the way upstream builds it.
      # The build dependencies are baked into a throwaway image so that the build itself can run
      # as the runner's own user: a root-owned target directory cannot be read back out.
      - name: Prepare the build image
        run: |
          set -euxo pipefail
          # Built from stdin so the whole repository is not sent as build context.
          printf 'FROM %s\nRUN apt-get update && apt-get install -y --no-install-recommends build-essential clang libpam0g-dev && rm -rf /var/lib/apt/lists/*\n' \
            "$BUILD_IMAGE" | docker build -t rauthy-ci-builder -

      - name: Build in a bookworm container
        run: |
          set -euxo pipefail
          jemalloc_env=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            jemalloc_env="-e JEMALLOC_SYS_WITH_LG_PAGE=16"
          fi
          docker run --rm \
            -v "$PWD":/work -w /work \
            -u "$(id -u):$(id -g)" \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_HOME=/work/.cargo-home \
            $jemalloc_env \
            rauthy-ci-builder \
            bash -euxc 'cargo build --release --locked && rustc -vV > rustc-version.txt'
          mv target/release/rauthy "rauthy_${{ matrix.arch }}"
          sha256sum "rauthy_${{ matrix.arch }}" > "rauthy_${{ matrix.arch }}.sha256"

      # A test-only build with Hiqlite's `__upgrade-fault-points`, for leg J's interruption cases.
      # Built after the release binary has been moved out, from a manifest edited only for this
      # build and restored afterwards; a feature does not change Cargo.lock, which is checked.
      # Its artifact name must not match the publish workflow's `rauthy-*` pattern.
      - name: Build the leg J fault-point binary (test only, never published)
        run: |
          set -euxo pipefail
          jemalloc_env=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            jemalloc_env="-e JEMALLOC_SYS_WITH_LG_PAGE=16"
          fi
          sed -i 's/"listen_notify_local", "macros"$/"listen_notify_local", "macros", "__upgrade-fault-points"/' Cargo.toml
          git diff --exit-code --quiet Cargo.toml && { echo "the fault feature was not added" >&2; exit 1; }
          docker run --rm \
            -v "$PWD":/work -w /work \
            -u "$(id -u):$(id -g)" \
            -e CARGO_TERM_COLOR=always \
            -e CARGO_HOME=/work/.cargo-home \
            $jemalloc_env \
            rauthy-ci-builder \
            bash -euxc 'cargo build --release --locked'
          git checkout -- Cargo.toml
          git diff --exit-code Cargo.lock
          mv target/release/rauthy "fault_rauthy_${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fault-build-${{ matrix.arch }}
          path: fault_rauthy_${{ matrix.arch }}
          retention-days: 30

      - name: Record what the binary links against
        run: |
          set -euxo pipefail
          file "rauthy_${{ matrix.arch }}"
          # The highest glibc symbol version the artifact requires: the floor a runtime must meet.
          objdump -T "rauthy_${{ matrix.arch }}" 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 > glibc-floor.txt || true
          cat glibc-floor.txt

      # What these bytes were built from, so that a publish run can check it against the tree it
      # is asked to publish instead of trusting that the run id it was given is the right one.
      - name: Write the candidate manifest
        run: |
          set -euo pipefail
          mkdir -p manifest
          ARCH="${{ matrix.arch }}" \
          REGISTRY_GRAPH="$(python3 assets/release/check_graph.py --report Cargo.lock 2>/dev/null)" \
          python3 - <<'PYEOF'
          import hashlib, json, os
          arch = os.environ["ARCH"]
          sha = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          json.dump({
              "arch": arch,
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "cargo_lock_sha256": sha("Cargo.lock"),
              "registry_graph": os.environ["REGISTRY_GRAPH"].strip() == "true",
              "build_image": os.environ["BUILD_IMAGE"],
              "rustc": open("rustc-version.txt").read(),
              "binary_sha256": sha(f"rauthy_{arch}"),
              "glibc_floor": open("glibc-floor.txt").read().strip(),
          }, open("manifest/candidate-manifest.json", "w"), indent=2)
          PYEOF
          cat manifest/candidate-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: rauthy-${{ matrix.arch }}
          path: |
            rauthy_${{ matrix.arch }}
            rauthy_${{ matrix.arch }}.sha256
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest-${{ matrix.arch }}
          path: manifest/candidate-manifest.json
          retention-days: 30

  acceptance:
    name: acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rauthy-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: fault-build-${{ matrix.arch }}
      - run: chmod +x "rauthy_${{ matrix.arch }}" "fault_rauthy_${{ matrix.arch }}"

      # The upstream release this build is based on, taken from its own published image, so the
      # upgrade and rollback legs run against the real baseline rather than a rebuild of it.
      - name: Extract the upstream baseline binary
        run: |
          set -euxo pipefail
          docker pull "$UPSTREAM_BASE_IMAGE"
          id="$(docker create "$UPSTREAM_BASE_IMAGE")"
          docker cp "$id:/app/rauthy" ./rauthy_upstream
          docker rm "$id" >/dev/null
          chmod +x ./rauthy_upstream
          ./rauthy_upstream --version

      - name: Extract the previous patched release's binary
        run: |
          set -euxo pipefail
          docker pull "$PREVIOUS_PATCHED_IMAGE"
          id="$(docker create "$PREVIOUS_PATCHED_IMAGE")"
          docker cp "$id:/app/rauthy" ./rauthy_previous
          docker rm "$id" >/dev/null
          chmod +x ./rauthy_previous
          ./rauthy_previous --version

      - name: Run the release acceptance
        env:
          # Keep the run inside the workspace so its logs can be uploaded on failure.
          ACCEPTANCE_WORK: ${{ github.workspace }}/acceptance-work
          # A skipped leg fails the run: a candidate that could not run a leg is not qualified
          # for it, however the job's colour reads.
          ACCEPTANCE_STRICT: '1'
          RAUTHY_FAULT: ${{ github.workspace }}/fault_rauthy_${{ matrix.arch }}
          RAUTHY_PREVIOUS: ${{ github.workspace }}/rauthy_previous
        run: |
          set -euo pipefail
          mkdir -p "$ACCEPTANCE_WORK"
          ./assets/release/acceptance.sh "./rauthy_${{ matrix.arch }}" ./rauthy_upstream

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.arch }}
          path: acceptance-work/**/*.log
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-result-${{ matrix.arch }}
          path: acceptance-work/acceptance-result.json
          retention-days: 30

  # The consumer's own live suite, run against this candidate the way the consumer runs it
  # against the release it pins: an image built from these bytes, a container on a fixed origin,
  # the binary taken out of that image, and RAHI_REQUIRE_RAUTHY=1 so that no gated test can skip.
  # It is checked out from the consumer's public repository at a pinned commit into this job's
  # workspace; nothing is written back to it.
  consumer:
    name: consumer (rahi live suite)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      LIVE_ORIGIN: http://localhost:8080
      LIVE_REG_TOKEN: rahi-live-registration-token
      LIVE_API_KEY_NAME: rahi
      LIVE_API_KEY_SECRET: RahiLiveApiKeySecret0123456789abcdefghijklmnopqrstuvwxyz0123456789
      LIVE_ADMIN: admin@localhost
      LIVE_ADMIN_PASSWORD: RahiLiveAdminPassword123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONSUMER_REPO }}
          ref: ${{ env.CONSUMER_REF }}
          path: consumer
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rauthy-amd64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: consumer

      - name: Build the image from the candidate bytes
        run: |
          set -euxo pipefail
          sha256sum -c rauthy_amd64.sha256
          mkdir -p out/empty
          cp rauthy_amd64 out/rauthy_amd64
          chmod +x out/rauthy_amd64
          docker build --platform linux/amd64 --build-arg VERSION=candidate \
            -t rauthy-candidate:local .
          id="$(docker create rauthy-candidate:local)"
          mkdir -p "$RUNNER_TEMP/rauthy"
          docker cp "$id:/app/rauthy" "$RUNNER_TEMP/rauthy/rauthy"
          docker rm "$id" > /dev/null
          cmp "$RUNNER_TEMP/rauthy/rauthy" rauthy_amd64
          "$RUNNER_TEMP/rauthy/rauthy" --version
          echo "RAHI_TEST_RAUTHY=$RUNNER_TEMP/rauthy/rauthy" >> "$GITHUB_ENV"

      # The same environment the consumer's `live.yml` gives the release it pins.
      - name: Start the candidate on the live origin
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rauthy.env" <<ENV
          PUB_URL=localhost:8080
          LISTEN_SCHEME=http
          LISTEN_ADDRESS=0.0.0.0
          LISTEN_PORT_HTTP=8080
          COOKIE_MODE=danger-insecure
          RP_ID=localhost
          RP_ORIGIN=${LIVE_ORIGIN}
          RP_NAME=rahi-live
          HQL_NODE_ID=1
          HQL_NODES=1 127.0.0.1:8100 127.0.0.1:8200
          HQL_LISTEN_ADDR_API=127.0.0.1
          HQL_LISTEN_ADDR_RAFT=127.0.0.1
          HQL_SECRET_RAFT=RahiLiveRaftSecret0123456789abcdefghijklmnopqrstuvwxyz0123456789
          HQL_SECRET_API=RahiLiveApiClusterSecret0123456789abcdefghijklmnopqrstuvwxyz0123456789
          ENC_KEYS=live/9/KslT9sVWd0aEnR9e0AVrd4aTue/etZIqCm4PsjsnU=
          ENC_KEY_ACTIVE=live
          ENABLE_DYN_CLIENT_REG=true
          DYN_CLIENT_REG_TOKEN=${LIVE_REG_TOKEN}
          DYN_CLIENT_RATE_LIMIT_SEC=0
          BOOTSTRAP_ADMIN_EMAIL=${LIVE_ADMIN}
          BOOTSTRAP_ADMIN_PASSWORD_PLAIN=${LIVE_ADMIN_PASSWORD}
          BOOTSTRAP_API_KEY_SECRET=${LIVE_API_KEY_SECRET}
          ENV
          key='{"name":"'"$LIVE_API_KEY_NAME"'","exp":1924991999,"access":[{"group":"Blacklist","access_rights":["read","create","update","delete"]},{"group":"Clients","access_rights":["read","create","update","delete"]},{"group":"Users","access_rights":["read","create","update","delete"]},{"group":"Roles","access_rights":["read","create","update","delete"]},{"group":"Scopes","access_rights":["read","create","update","delete"]}]}'
          echo "BOOTSTRAP_API_KEY=$(printf '%s' "$key" | base64 -w0)" >> "$RUNNER_TEMP/rauthy.env"
          : > "$RUNNER_TEMP/config.toml"
          docker run -d --name rauthy-live -p 8080:8080 \
            --env-file "$RUNNER_TEMP/rauthy.env" \
            -v "$RUNNER_TEMP/config.toml:/app/config.toml:ro" \
            rauthy-candidate:local
          for _ in $(seq 1 120); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_ORIGIN/auth/v1/health")" = "200" ]; then
              echo "rauthy is healthy"; exit 0
            fi
            sleep 1
          done
          docker logs rauthy-live >&2
          exit 1

      - name: The consumer's whole suite, with rauthy and no skips allowed
        working-directory: consumer
        env:
          RAHI_REQUIRE_RAUTHY: '1'
          RAHI_TEST_RAUTHY_URL: ${{ env.LIVE_ORIGIN }}
          RAHI_TEST_RAUTHY_REG_TOKEN: ${{ env.LIVE_REG_TOKEN }}
          RAHI_TEST_RAUTHY_API_KEY: ${{ env.LIVE_API_KEY_NAME }}$${{ env.LIVE_API_KEY_SECRET }}
          RAHI_TEST_RAUTHY_USER: ${{ env.LIVE_ADMIN }}
          RAHI_TEST_RAUTHY_PASSWORD: ${{ env.LIVE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          rustup show
          cargo test --workspace --locked --no-fail-fast -- --test-threads=2

      - name: rauthy's log
        if: always()
        run: docker logs rauthy-live > rauthy-live.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-rauthy-log
          path: rauthy-live.log
          retention-days: 30
          if-no-files-found: ignore
