# Independent review of a release candidate.
#
# Separate from release-candidate.yaml for one empirical reason: claude-code-action refuses a
# `push` event ("Unsupported event type: push"), so the review has to hang off the pull request
# that opens the release line. Keeping it in its own file also means the review is not re-run by
# every push to the branch, and that the whole build matrix is not re-run by every pull request.
#
# Trigger safety: this is `pull_request`, not `pull_request_target`. A pull request from a fork
# therefore gets no secrets and a read-only token, so untrusted code cannot reach the review
# credential. The job holds no publication credential of any kind.
name: release review

on:
  pull_request:
    branches:
      - 'patched/**'
  workflow_dispatch:

permissions: {}

jobs:
  review:
    name: independent review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the review credential is present
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set; the review cannot run" >&2
            exit 1
          fi
          echo "review credential present"

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Read the tree and run git. The job's `permissions` above are the real boundary:
          # `contents: read` and `pull-requests: write`, and nothing that could publish.
          claude_args: '--allowedTools "Bash,Read,Grep,Glob"'
          prompt: |
            Review this pull request against the upstream release it is based on, which is
            upstream's `v0.36.2` at commit `dd61ac3c84d6b238108dc8438b53043b5177a662`:

            ```
            git diff dd61ac3c84d6b238108dc8438b53043b5177a662...HEAD
            ```

            Use the commit, not the tag. That tag lives in the upstream repository; this fork
            does not carry it, and this release line deliberately does not republish upstream's
            release tags under its own name.

            This is a downstream patched distribution of Rauthy, an identity provider. Report
            concrete defects with a file and line, and say plainly when a concern does not hold.
            Do not restate what the code does. Focus on, in order:

            1. Authentication and authorization regressions. Anything that weakens MFA, TLS
               verification, token validation, audience or scope enforcement, or admin-session
               checks is the most serious finding available.
            2. Error and readiness propagation out of the storage layer: whether a failure can
               still reach a caller as a success, and whether `/ready` and `/health` can report
               healthy while storage is not.
            3. Storage ownership and shutdown: whether any exit path after the storage layer
               starts can skip its shutdown, and whether a second process could touch a data
               directory another process owns.
            4. Backup, restore and upgrade safety: truncation, partial writes, destroying the last
               recoverable state, and the version stamped into the database locking out a
               rollback to upstream v0.36.2.
            5. Dependency and package provenance. This release consumes `hiqlite-patched`,
               `hiqlite-wal-patched` and `hiqlite-derive-patched` from crates.io through a Cargo
               package alias. Any Hiqlite package that resolves from a path, a git source, or
               under upstream's own `hiqlite*` names, or a second copy of any of them or of
               `openraft`, is a blocking finding. Read `Cargo.lock`, not just `Cargo.toml`.
            6. The Hiqlite lifecycle contract as Rauthy's callers use it: typed startup errors,
               cleanup after a partial initialization in `DB::init`, readiness after a terminal
               node failure (`Client::node_failure`), refusal of operations after one, and the
               bounded shutdown. Check `git diff origin/patched/0.36.2...HEAD` for what changed
               since the last reviewed state of the release line, and review that diff hardest.
            7. Workflow permissions and publication correctness: over-broad `permissions`, a
               credential reachable from untrusted code, a publication destination that is not
               under the bartekus namespace, and whether `release-publish.yaml` can be made to
               promote anything other than a green, strict, first-attempt candidate run of this
               repository on the exact reviewed commit.
            8. Acceptance legs that cannot fail. An assertion that passes whatever the product
               does is worse than none, because the ledger cites it as evidence.

            `RELEASE-LEDGER.md` states what this release claims, and `RELEASE-HANDOFF.md` states
            what the consumer is told. Treat a claim in either that the code does not support as a
            finding in its own right.

            Work in the foreground only. Do not start background tasks and do not wait for
            notifications: nothing will arrive, and a review that ends while waiting has no
            verdict.

            The last line of your final answer must be exactly one of these two, and nothing may
            follow it:

            VERDICT: no blocking findings
            VERDICT: blocking findings

            Do not try to post anything yourself: the step after this one takes your final answer
            and publishes it, so that the review is on the record whether or not you think to put
            it there.

      # The first review run finished cleanly and left nothing behind: no comment, no job summary,
      # and the execution log stays on the runner. Publishing the verdict is therefore this
      # workflow's job, not the reviewer's, so that a review cannot silently evaporate and be
      # mistaken for an approval.
      - name: Publish the review
        if: always() && steps.review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > review.md
          import json, os

          raw = open(os.environ["EXECUTION_FILE"]).read()
          try:
              entries = json.loads(raw)
              if not isinstance(entries, list):
                  entries = [entries]
          except json.JSONDecodeError:
              # The log is also written as one JSON object per line in some versions.
              entries = []
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      entries.append(json.loads(line))
                  except json.JSONDecodeError:
                      pass

          parts = []
          for entry in entries:
              if not isinstance(entry, dict) or entry.get("type") != "assistant":
                  continue
              for block in entry.get("message", {}).get("content", []):
                  if isinstance(block, dict) and block.get("type") == "text":
                      text = block.get("text", "").strip()
                      if text:
                          parts.append(text)

          print(f"## Independent review of `{os.environ['HEAD_SHA'][:12]}`\n")
          if parts:
              print(parts[-1])
          else:
              print("_The reviewer produced no text output. The execution log is attached to "
                    "this run as an artifact._")
          PY
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          # `gh pr comment` posts an issue comment, which needs `issues: write`; this job
          # deliberately does not have it. A comment-type review goes through the pulls API and
          # needs only the `pull-requests: write` this job already holds.
          if [ -n "$PR_NUMBER" ]; then
            gh pr review "$PR_NUMBER" --comment --body-file review.md
          fi
          # The publish gate accepts a successful run of this workflow on the reviewed head, so a
          # success must mean a verdict. A reviewer that ended without one (observed: a final
          # answer of "Still running") or with a blocking one fails the run.
          verdict="$(grep -E '^VERDICT: ' review.md | tail -1 || true)"
          echo "verdict line: ${verdict:-none}"
          case "$verdict" in
            "VERDICT: no blocking findings") ;;
            "VERDICT: blocking findings") echo "the review found blocking findings" >&2; exit 1 ;;
            *) echo "the review produced no verdict" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always() && steps.review.outputs.execution_file != ''
        with:
          name: review-execution-log
          path: ${{ steps.review.outputs.execution_file }}
          retention-days: 7
